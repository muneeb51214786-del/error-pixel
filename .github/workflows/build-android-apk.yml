name: Build Enhance Error Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - enhance-error
    paths:
      - "App.js"
      - "supabase.js"
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - "eas.json"
      - "modules/**"
      - "gpu-backend/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    name: Build installable Android APK locally
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_RIFE_WORKER_URL: ${{ vars.EXPO_PUBLIC_RIFE_WORKER_URL }}
      EXPO_PUBLIC_FILM_WORKER_URL: ${{ vars.EXPO_PUBLIC_FILM_WORKER_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install project dependencies
        run: npm install

      - name: Validate Android JavaScript bundle
        run: npx expo export --platform android --output-dir /tmp/enhance-error-export

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build installable release APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew assembleRelease --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle dependency download/build failed (attempt $attempt). Retrying after a short delay..."
              sleep $((attempt * 25))
            fi
          done
          echo "Gradle build failed after 3 attempts."
          exit 1

      - name: Verify APK archive and Android package
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APK_SIZE=$(stat -c%s "$APK")
          echo "APK size: ${APK_SIZE} bytes"
          test "$APK_SIZE" -gt 1000000
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          AAPT=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging "$APK" | tee /tmp/error-pixel-badging.txt
            grep -q "package: name='com.erroreditx.enhanceerror'" /tmp/error-pixel-badging.txt
          fi

      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: enhance-error-apk-${{ github.run_number }}
          name: Enhance Error Android APK ${{ github.run_number }}
          body: |
            Installable Enhance Error Android release APK with the JavaScript bundle packaged for offline launch.
            This APK is built for direct installation and includes the bundled JavaScript.
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true

      - name: Add direct APK link to build summary
        shell: bash
        run: |
          APK_URL="https://github.com/${{ github.repository }}/releases/download/enhance-error-apk-${{ github.run_number }}/app-release.apk"
          {
            echo "## Enhance Error — APK build"
            echo ""
            echo "[**Download the installable APK**](${APK_URL})"
            echo ""
            echo "Enhance Error release APK with packaged JavaScript bundle."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ENHANCE-ERROR-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
