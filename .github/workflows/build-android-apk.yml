name: Build ERROR PIXEL Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "App.js"
      - "app.json"
      - "package.json"
      - "eas.json"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build-apk:
    name: Build and verify installable Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install

      - name: Validate Android JavaScript bundle
        run: npx expo export --platform android --output-dir /tmp/error-pixel-export

      - name: Build APK with Expo EAS and wait for completion
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --wait

      - name: Download the actual APK from the completed EAS build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          BUILD_JSON=$(npx eas-cli@latest build:list --platform android --limit 1 --json)
          BUILD_URL=$(printf '%s' "$BUILD_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const v=JSON.parse(s);const a=Array.isArray(v)?v:(v.builds||[]);const b=a[0];const u=b?.artifacts?.buildUrl||b?.artifacts?.applicationArchiveUrl||b?.buildUrl||b?.applicationArchiveUrl;if(!u){console.error('Latest EAS build response did not include an APK download URL.');process.exit(2);}process.stdout.write(u);});")
          echo "Downloading completed EAS APK directly from its artifact URL."
          curl --fail --location --retry 3 --retry-delay 2 "$BUILD_URL" --output ./ERROR-PIXEL.apk
          test -s ./ERROR-PIXEL.apk

      - name: Verify APK file, archive, package and signature
        shell: bash
        run: |
          set -euo pipefail
          test -s ./ERROR-PIXEL.apk
          APK_SIZE=$(stat -c%s ./ERROR-PIXEL.apk)
          echo "APK size: ${APK_SIZE} bytes"
          test "${APK_SIZE}" -gt 1000000
          file ./ERROR-PIXEL.apk
          unzip -t ./ERROR-PIXEL.apk
          unzip -l ./ERROR-PIXEL.apk | grep -q 'AndroidManifest.xml'
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -z "${APKSIGNER}" ]; then
            echo "Android apksigner was not found; cannot certify APK signature."
            exit 1
          fi
          "${APKSIGNER}" verify --verbose ./ERROR-PIXEL.apk
          AAPT=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -n 1)
          if [ -n "${AAPT}" ]; then
            "${AAPT}" dump badging ./ERROR-PIXEL.apk | tee /tmp/error-pixel-badging.txt
            grep -q "package: name='com.erroreditx.errorpixel'" /tmp/error-pixel-badging.txt
          fi

      - name: Upload verified APK to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ERROR-PIXEL-verified-APK
          path: ./ERROR-PIXEL.apk
          if-no-files-found: error
          retention-days: 14
