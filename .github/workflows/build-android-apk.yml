name: Build ERROR PIXEL Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "App.js"
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - "eas.json"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    name: Build installable Android APK locally
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install project dependencies
        run: npm install

      - name: Validate Android JavaScript bundle
        run: npx expo export --platform android --output-dir /tmp/error-pixel-export

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build installable release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK archive and Android package
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APK_SIZE=$(stat -c%s "$APK")
          echo "APK size: ${APK_SIZE} bytes"
          test "$APK_SIZE" -gt 1000000
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          AAPT=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging "$APK" | tee /tmp/error-pixel-badging.txt
            grep -q "package: name='com.erroreditx.errorpixel'" /tmp/error-pixel-badging.txt
          fi

      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: error-pixel-apk-${{ github.run_number }}
          name: ERROR PIXEL Android APK ${{ github.run_number }}
          body: |
            Installable ERROR PIXEL Android release APK with the JavaScript bundle packaged for offline launch.
            This APK is built for direct installation and includes the bundled JavaScript.
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true

      - name: Add direct APK link to build summary
        shell: bash
        run: |
          APK_URL="https://github.com/${{ github.repository }}/releases/download/error-pixel-apk-${{ github.run_number }}/app-release.apk"
          {
            echo "## ERROR PIXEL — APK build"
            echo ""
            echo "[**Download the installable APK**](${APK_URL})"
            echo ""
            echo "Release APK with packaged JavaScript bundle."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ERROR-PIXEL-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
